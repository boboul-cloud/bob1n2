<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1b8e56">
  <meta name="description" content="Bob 1N2 : le concours de pronostics foot du comptoir, en points virtuels.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Bob 1N2">
  <title>Bob 1N2</title>
  <link rel="manifest" href="manifest.webmanifest">
  <script>
    // iPhone, iPad : l'icône de l'écran d'accueil ouvre Bob 1N2 dans Safari, avec sa mémoire. Une app
    // web ouverte hors de Safari en aurait une à part, que les liens (grilles renvoyées par les
    // joueurs, qui s'ouvrent toujours dans Safari) n'atteindraient pas.
    (function () {
      var ua = navigator.userAgent;
      if (!/iPhone|iPad|iPod/.test(ua) && !(ua.indexOf('Macintosh') >= 0 && navigator.maxTouchPoints > 1)) return;
      document.querySelector('link[rel="manifest"]').href = 'manifest-safari.webmanifest';
      var capable = document.querySelector('meta[name="apple-mobile-web-app-capable"]');
      if (capable) capable.remove();
    })();
  </script>
  <link rel="icon" type="image/png" sizes="32x32" href="icones/favicon-32.png">
  <link rel="apple-touch-icon" href="icones/icone-180.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app"><noscript>Bob 1N2 a besoin de JavaScript.</noscript></div>
  <div id="impression"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
